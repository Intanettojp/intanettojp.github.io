<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erro 404</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            margin: 0;
            text-align: center;
            background-color: #e8e8e8;
            font-family:  "Exo 2", Google Sans, sans-serif;
        }
        .image-container img {
            width: 400px;
            height: 400px;
            object-fit: cover;
            border-radius: 4px;
        }
        .button {
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #15e;
            color: white;
            border: none;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            text-decoration: none;
        }
        .button:hover {
            background-color: #0000cc;
        }
    </style>

</head>
<body>

    <div class="image-container">
        <img src="https://news.thestories.cc/img/giphy.gif" alt="Erro 404">
    </div>

    <a href="/" id="btn-post" class="button">ESTAMOS AQUI!</a>

    <script>
        // 1. Pega o caminho exato que deu erro na barra do navegador (ex: /new-post.html)
        var caminho = window.location.pathname;

        // 2. Seleciona o nosso botão ali de cima
        var botao = document.getElementById('btn-post');

        // 3. Verifica se a pessoa tentou acessar um arquivo .html antigo (que não tenha o /p/)
        if (caminho.endsWith('.html') && !caminho.startsWith('/p/')) {
            // Monta o link novo e injeta no botão
            botao.href = '/p' + caminho;
        } else {
            // Bônus: Se a pessoa digitar um erro que NÃO é de um post (ex: /abobrinha)
            // O botão muda o texto e funciona para voltar para a página inicial
            botao.href = '/';
            botao.innerText = 'PAGINA INICIAL';
        }
    </script>

</body>
</html>
